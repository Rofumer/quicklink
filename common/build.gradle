architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury is only needed at compile time for annotation processing.
    // It is NOT bundled into the output jar — users don't need it installed.
    compileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"
}
