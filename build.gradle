plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = maven_group
version = mod_version
archivesBaseName = archives_name

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                quicklink { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                quicklink { source sourceSets.main }
            }
        }
    }
}

repositories {
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'Bai Maven'
        url = 'https://maven.bai.lol'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly("mekanism:Mekanism:${minecraft_version}-${mekanism_version}:api") { transitive = false }
    // Jade (hover-tooltip overlay mod, optional at runtime)
    compileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
    // WTHIT (What The Hell Is That, optional at runtime)
    compileOnly("mcp.mobius.waila:wthit-api:${wthit_api_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = ''
    manifest {
        attributes([
            'Specification-Title'     : 'QuickLink',
            'Specification-Vendor'    : 'maximpolyakov',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'maximpolyakov',
            'MixinConfigs'            : 'quicklink.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

mixin {
    add sourceSets.main, 'quicklink.refmap.json'
    config 'quicklink.mixins.json'
}
