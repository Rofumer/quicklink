plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.171'
    id 'maven-publish'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java', 'neoforge/src/main/java']
        }
        resources {
            srcDirs = ['neoforge/src/main/resources']
        }
    }
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {}
    server {}
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    compileOnly("mekanism:Mekanism:${mekanism_version}:api") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
